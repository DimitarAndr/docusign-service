services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: docusign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./keys/private.pem:/app/keys/private.pem:ro
      - ./documents:/app/documents:ro
    environment:
      # Force container to reach the db service (ignore host/local values)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/docusign?schema=public
    depends_on:
      - db

volumes:
  db_data:
